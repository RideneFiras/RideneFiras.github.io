<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FR · send invites</title>
  <!-- private page: opened from the "Send list to phone" link in the admin, never listed anywhere -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f5f4ef">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f5f4ef; --card: #fdfcf9; --text: #111b2b; --muted: #46536a;
      --line: rgba(17, 27, 43, 0.14); --blue: #2553c4; --blue-deep: #1c3e95;
      --ok: #1d7a4f; --err: #b3382f;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1014; --card: #17181f; --text: #f4f3ef; --muted: #a4a3ad; --line: rgba(244, 243, 239, 0.14); --ok: #5fc896; --err: #ff6b6b; }
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("../../assets/fonts/plex-mono-400.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--mono);
      font-size: 16px;
      line-height: 1.45;
      background: var(--bg);
      color: var(--text);
      max-width: 560px;
      margin: 0 auto;
      padding: 1.1rem 16px calc(2.4rem + env(safe-area-inset-bottom));
    }
    header {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--bg);
      padding: 0.4rem 0 0.8rem;
    }
    h1 { font-size: 1.05rem; }
    #progress { color: var(--muted); font-size: 0.86rem; }
    .guest {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.85rem;
      margin-bottom: 0.7rem;
    }
    .guest.done { opacity: 0.55; }
    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; margin-bottom: 0.65rem; }
    .name { font-weight: 500; overflow-wrap: anywhere; }
    .flags { flex: none; color: var(--muted); font-size: 0.74rem; }
    .acts { display: flex; gap: 0.5rem; }
    button {
      font-family: var(--mono);
      font-size: 1rem;
      min-height: 48px;
      border-radius: 10px;
      border: 1px solid var(--blue);
      background: var(--blue);
      color: #fff;
      flex: 1;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: var(--blue-deep); }
    button.ghost { background: transparent; color: var(--text); border-color: var(--line); flex: 0 0 auto; padding: 0 1rem; }
    .guest.done button.copy { background: transparent; color: var(--ok); border-color: var(--ok); }
    .manual { display: none; margin-top: 0.6rem; }
    .manual.on { display: block; }
    .manual p { color: var(--err); font-size: 0.8rem; margin-bottom: 0.3rem; }
    .manual input {
      width: 100%;
      font-family: var(--mono);
      font-size: 16px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.55rem;
    }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Send invites</h1>
    <p id="progress"></p>
  </header>
  <main id="list"></main>

  <script>
  (function () {
    "use strict";
    /* #<code>.<code>… where each code is what follows # in a guest's short link.
       same decoder as pfe/index.html and admin.html: it hides names, it is not encryption */
    var B62 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
    var SYM = " abcdefghijklmnopqrstuvwxyz,-'";
    var ACC = "éèêëàâäîïôöûüùçñÿœæáíóúãõåøß";
    var ESC = 31, CP = 31;
    var key = function (i, n) { return (i * 7 + n * 13 + 5) % 31; };
    var mod = function (a, m) { return ((a % m) + m) % m; };
    function decode(code) {
      var v = BigInt(0), s = [], d = [], out = "";
      for (var i = 0; i < code.length; i++) {
        var k = B62.indexOf(code[i]);
        if (k < 0) return null;
        v = v * BigInt(62) + BigInt(k);
      }
      while (v > BigInt(0)) {
        var x = Number(v % BigInt(32));
        if (!x) return null;
        s.push(x); v = v / BigInt(32);
      }
      var n = s.length, prev = 0;
      for (var j = 0; j < n; j++) { d.push(mod(s[j] - 1 - prev - key(j, n), 31) + 1); prev = s[j] - 1; }
      for (var p = 0; p < n; p++) {
        if (d[p] !== ESC) { out += SYM[d[p] - 1] || ""; continue; }
        var t = d[++p];
        if (t === CP) { out += String.fromCodePoint((d[p + 1] - 1) + (d[p + 2] - 1) * 31 + (d[p + 3] - 1) * 961); p += 3; }
        else out += ACC[t - 1] || "";
      }
      return out;
    }
    var title = function (s) {
      return s.replace(/(^|[\s,-])(\p{L})/gu, function (m, a, b) { return a + b.toLocaleUpperCase(); }).replace(/,\s*/g, ", ");
    };

    var STORE = "pfe_sent";
    var sent = {};
    try { sent = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) {}
    var remember = function () { try { localStorage.setItem(STORE, JSON.stringify(sent)); } catch (e) {} };

    var guests = location.hash.slice(1).split(".").filter(function (c) {
      return /^[0-5][0-9A-Za-z]{1,80}$/.test(c);
    }).map(function (c) {
      var name = decode(c.slice(1));
      var gender = ["", "F", "M"][c[0] % 3];
      return name && { code: c, name: title(name), flags: [gender, c[0] >= 3 ? "EN" : "FR"].filter(Boolean).join(" · "), link: location.origin + "/pfe/#" + c };
    }).filter(Boolean);

    var list = document.getElementById("list");
    function progress() {
      var done = guests.filter(function (g) { return sent[g.code]; }).length;
      document.getElementById("progress").textContent = done + " / " + guests.length + " copied";
    }
    if (!guests.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No guests in this link. In the admin, open pfe invites and use Send list to phone.";
      list.appendChild(p);
    }

    /* in-app browsers can refuse the clipboard API, so fall back to the older way, then to selecting by hand */
    function legacyCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;opacity:0;font-size:16px";
      document.body.appendChild(ta);
      ta.setSelectionRange(0, text.length);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
      return ok;
    }
    function copy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
      }
      return Promise.resolve(legacyCopy(text));
    }

    guests.forEach(function (g) {
      var row = document.createElement("article");
      row.className = "guest";
      var top = document.createElement("div"); top.className = "top";
      var name = document.createElement("span"); name.className = "name"; name.textContent = g.name;
      var flags = document.createElement("span"); flags.className = "flags"; flags.textContent = g.flags;
      top.appendChild(name); top.appendChild(flags);

      var acts = document.createElement("div"); acts.className = "acts";
      var btn = document.createElement("button"); btn.type = "button"; btn.className = "copy";
      acts.appendChild(btn);

      var manual = document.createElement("div"); manual.className = "manual";
      var hint = document.createElement("p"); hint.textContent = "Copy was blocked here. Hold the link below to copy it, or open this page in Safari.";
      var field = document.createElement("input"); field.readOnly = true; field.value = g.link;
      manual.appendChild(hint); manual.appendChild(field);

      function mark() {
        row.classList.toggle("done", !!sent[g.code]);
        btn.textContent = sent[g.code] ? "Copied ✓" : "Copy link";
        progress();
      }
      btn.addEventListener("click", function () {
        copy(g.link).then(function (ok) {
          manual.classList.toggle("on", !ok);
          if (!ok) return;
          sent[g.code] = 1; remember(); mark();
          if (navigator.vibrate) navigator.vibrate(12);
        });
      });
      if (navigator.share) {
        var share = document.createElement("button");
        share.type = "button"; share.className = "ghost"; share.textContent = "Share";
        share.addEventListener("click", function () {
          navigator.share({ url: g.link }).then(function () { sent[g.code] = 1; remember(); mark(); }, function () {});
        });
        acts.appendChild(share);
      }

      row.appendChild(top); row.appendChild(acts); row.appendChild(manual);
      list.appendChild(row);
      mark();
    });
    progress();
  })();
  </script>
</body>
</html>
