name: Prerender static content

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "js/render.js"
      - "scripts/prerender.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate index.html from data/*.json
        run: node scripts/prerender.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No content changes, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: prerender index.html from data/*.json [skip ci]"
          git push
